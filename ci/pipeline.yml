---
jobs:

- name: set-self
  plan:
    - get: cert-check-src
      trigger: true
#    - set_pipeline: self
#      file: cert-check-src/ci/pipeline.yml
#      var_files:
#        - cert-check-src/ci/config.yml

- name: run-cert-check
  plan:
  - get: general-task
  - get: schedule
    trigger: true
  - get: cert-check-src
    passed: [set-self]
  - in_parallel:
    - task: run-cert-check-master-bosh
      image: general-task
      file: cert-check-src/check.yml
      params:
        BOSH_CA_CERT: ((bosh-director-info.master.ca_cert))
        BOSH_ENVIRONMENT: ((bosh-director-info.master.environment))
        BOSH_USERNAME: ((master-bosh-username))
        BOSH_PASSWORD: ((master-bosh-password))
        SLACK_WEBHOOK: ((slack-webhook-url))
        SLACK_CHANNEL: ((slack-channel))
        AWS_DEFAULT_REGION: ((aws-region))
        NO_ELB_CHECK: 1
    - task: run-cert-check-tooling-bosh
      image: general-task
      file: cert-check-src/check.yml
      params:
        BOSH_CA_CERT: ((bosh-director-info.tooling.ca_cert))
        BOSH_ENVIRONMENT: ((bosh-director-info.tooling.environment))
        BOSH_USERNAME: ((tooling-bosh-username))
        BOSH_PASSWORD: ((tooling-bosh-password))
        SLACK_WEBHOOK: ((slack-webhook-url))
        SLACK_CHANNEL: ((slack-channel))
        AWS_DEFAULT_REGION: ((aws-region))
        NO_ELB_CHECK: 1
    - task: run-cert-check-dev-bosh
      image: general-task
      file: cert-check-src/check.yml
      params:
        BOSH_CA_CERT: ((bosh-director-info.development.ca_cert))
        BOSH_ENVIRONMENT: ((bosh-director-info.development.environment))
        BOSH_USERNAME: ((dev-bosh-username))
        BOSH_PASSWORD: ((dev-bosh-password))
        SLACK_WEBHOOK: ((slack-webhook-url))
        SLACK_CHANNEL: ((slack-channel))
        AWS_DEFAULT_REGION: ((aws-region))
        NO_ELB_CHECK: 1
    - task: run-cert-check-staging-bosh
      image: general-task
      file: cert-check-src/check.yml
      params:
        BOSH_CA_CERT: ((bosh-director-info.staging.ca_cert))
        BOSH_ENVIRONMENT: ((bosh-director-info.staging.environment))
        BOSH_USERNAME: ((staging-bosh-username))
        BOSH_PASSWORD: ((staging-bosh-password))
        SLACK_WEBHOOK: ((slack-webhook-url))
        SLACK_CHANNEL: ((slack-channel))
        AWS_DEFAULT_REGION: ((aws-region))
        NO_ELB_CHECK: 1
    - task: run-cert-check-production-bosh
      image: general-task
      file: cert-check-src/check.yml
      params:
        BOSH_CA_CERT: ((bosh-director-info.production.ca_cert))
        BOSH_ENVIRONMENT: ((bosh-director-info.production.environment))
        BOSH_USERNAME: ((production-bosh-username))
        BOSH_PASSWORD: ((production-bosh-password))
        SLACK_WEBHOOK: ((slack-webhook-url))
        SLACK_CHANNEL: ((slack-channel))
        AWS_DEFAULT_REGION: ((aws-region))
        NO_ELB_CHECK: 1
  on_failure:
    put: slack
    params:
      text: |
        :x: FAILED to run cg-cert-check
        <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|View build details>
      channel: ((slack-channel))
      username: ((slack-username))

- name: pull-status-check
  plan:
  - get: general-task
  - get: pull-request
    version: every
    trigger: true
  - put: pull-request
    params:
      path: pull-request
      status: pending
  - task: run-cert-check-tooling-bosh
    image: general-task
    file: pull-request/pr-test.yml
    on_success:
      put: pull-request
      params:
        path: pull-request
        status: success
    on_failure:
      put: pull-request
      params:
        path: pull-request
        status: failure

resources:
- name: schedule
  type: time
  source:
    interval: ((schedule-interval))

- name: cert-check-src
  type: git
  source:
    uri: ((cert-check-git-url))
    branch: test2 #((cert-check-git-branch))
    commit_verification_keys: ((cloud-gov-pgp-keys))

- name: slack
  type: slack-notification
  source:
    url: ((slack-webhook-url))

- name: pull-request
  type: pull-request
  source:
    repository: ((github-repo))
    access_token: ((status-access-token))
    disable_forks: true

- name: general-task
  type: registry-image
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_secret_access_key: ((ecr_aws_secret))
    repository: general-task
    aws_region: us-gov-west-1
    tag: latest

resource_types:
- name: registry-image
  type: registry-image
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_secret_access_key: ((ecr_aws_secret))
    repository: registry-image-resource
    aws_region: us-gov-west-1
    tag: latest

- name: slack-notification
  type: registry-image
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_secret_access_key: ((ecr_aws_secret))
    repository: slack-notification-resource
    aws_region: us-gov-west-1
    tag: latest

- name: s3-iam
  type: registry-image
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_secret_access_key: ((ecr_aws_secret))
    repository: s3-resource
    aws_region: us-gov-west-1
    tag: latest

- name: pull-request
  type: registry-image
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_secret_access_key: ((ecr_aws_secret))
    repository: github-pr-resource
    aws_region: us-gov-west-1
    tag: latest

- name: git
  type: registry-image
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_secret_access_key: ((ecr_aws_secret))
    repository: git-resource
    aws_region: us-gov-west-1
    tag: latest

- name: time
  type: registry-image
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_secret_access_key: ((ecr_aws_secret))
    repository: time-resource
    aws_region: us-gov-west-1
    tag: latest
